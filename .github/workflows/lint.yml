name: Lint Add-on

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint pwg-converter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Home Assistant Add-on Linter
        uses: frenck/action-addon-linter@v2
        with:
          path: "./pwg-converter"